name: vtafarm
replicaCount: 1

image:
  repository: ""
  tag: ""

service:
  port: 80

ingress:
  host: ""

# No CPU limit: the request gives fair-share under contention; a CFS quota
# would throttle bursts on an idle node. Memory keeps a hard limit.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
